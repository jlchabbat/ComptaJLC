{% load compta %}<table class="sit-table"><tr><th>Code</th><th>Libellé</th><th class="n">Solde</th></tr>
{% for l in lignes %}<tr><td>{{ l.code|default:"—" }}</td><td>{{ l.libelle|default:"(sans code)" }}</td><td class="n {% if l.resultat < 0 %}neg{% endif %}"><b>{{ l.resultat|shekel }}</b></td></tr>
{% empty %}<tr><td colspan="3">Aucun mouvement sur la période.</td></tr>{% endfor %}
<tr class="total"><td colspan="2">Total</td><td class="n">{{ total|shekel }}</td></tr></table>
