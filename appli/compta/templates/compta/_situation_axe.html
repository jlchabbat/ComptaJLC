{% load compta %}<table class="sit-table"><tr><th>Code</th><th>Libellé</th><th class="n">Produits</th><th class="n">Charges</th><th class="n">Résultat</th></tr>
{% for l in lignes %}<tr><td>{{ l.code|default:"—" }}</td><td>{{ l.libelle|default:"(sans code)" }}</td><td class="n">{{ l.produits|zero_vide }}</td><td class="n">{{ l.charges|zero_vide }}</td><td class="n {% if l.resultat < 0 %}neg{% endif %}"><b>{{ l.resultat|shekel }}</b></td></tr>
{% empty %}<tr><td colspan="5">Aucun mouvement sur la période.</td></tr>{% endfor %}</table>
