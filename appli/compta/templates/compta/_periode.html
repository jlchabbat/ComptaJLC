<form class="filtres" method="get">{% for k, v in request.GET.items %}{% if k != "du" and k != "au" and k != "page" %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endif %}{% endfor %}
<label>Du <input type="date" name="du" value="{{ debut|date:'Y-m-d' }}"></label>
<label>Au <input type="date" name="au" value="{{ fin|date:'Y-m-d' }}"></label>
<button class="principal">Afficher</button></form>
