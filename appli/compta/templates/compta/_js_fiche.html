{{ parametres|json_script:"parametres-fiche" }}
<script>
(function () {
  // natures et modes : seulement ceux du sens choisi (recette ou dépense)
  var p = JSON.parse(document.getElementById("parametres-fiche").textContent);
  var nature = document.getElementById("id_nature"), mode = document.getElementById("id_mode");
  var pers = document.getElementById("id_personnes"), justif = document.getElementById("id_justificatif");
  function filtrer(sel, table, sens, tous) {
    if (!sel) return;
    for (var i = 0; i < sel.options.length; i++) {
      var o = sel.options[i], s = table[o.value];
      o.hidden = !!(o.value && s !== sens && !(tous && s === "*"));
    }
    if (sel.selectedOptions[0] && sel.selectedOptions[0].hidden) sel.value = "";
    if (sel.majListe) sel.majListe();
  }
  function ligneDe(el) { return el ? [el.closest("div"), el.closest("div").previousElementSibling] : []; }
  function maj() {
    var coche = document.querySelector("input[name=sens]:checked");
    var sens = coche ? coche.value : "R";
    filtrer(nature, p.natures, sens, false);
    filtrer(mode, p.modes, sens, true);
    ligneDe(pers).forEach(function (e) { e.style.display = sens === "R" ? "" : "none"; });
    ligneDe(justif).forEach(function (e) { e.style.display = sens === "D" ? "" : "none"; });
  }
  // tiers connu / nouveau tiers : l'un grise l'autre ; cliquer sur le tiers connu le réactive
  var qui = document.getElementById("id_qui"), nom = document.getElementById("id_nouveau_nom"), pre = document.getElementById("id_nouveau_prenom");
  function grise(el, oui) { var c = el && (el.closest(".liste-cherchable") || el); if (c) { c.style.opacity = oui ? ".45" : ""; } }
  function tiers() {
    var nouveau = !!((nom && nom.value) || (pre && pre.value));
    grise(qui, nouveau);
    if (nouveau && qui) { qui.value = ""; if (qui.majListe) qui.majListe(); }
  }
  if (nom && qui) {
    [nom, pre].forEach(function (e) { e.addEventListener("input", tiers); });
    var boite = qui.closest(".liste-cherchable");
    (boite || qui).addEventListener("focusin", function () { nom.value = ""; pre.value = ""; grise(qui, false); });
    qui.addEventListener("change", function () { if (qui.value) { nom.value = ""; pre.value = ""; } });
    tiers();
  }
  document.querySelectorAll("input[name=sens]").forEach(function (r) { r.addEventListener("change", maj); });
  maj();
  window.addEventListener("DOMContentLoaded", maj);
})();
</script>
