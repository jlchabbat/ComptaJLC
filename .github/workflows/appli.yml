name: Application ComptaJLC

# Tests à chaque envoi.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r appli/requirements.txt pyflakes
      - run: python -m pyflakes appli/compta appli/comptajlc
      - run: python manage.py test compta
        working-directory: appli
        env:
          COMPTAJLC_DATA: ${{ runner.temp }}/data
