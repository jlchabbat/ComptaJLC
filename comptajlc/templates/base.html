<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ComptaJLC</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<nav><strong>ComptaJLC</strong>
<a href="{{ url_for('compta.accueil') }}">Accueil</a>
<a href="{{ url_for('compta.saisie') }}">Saisie</a>
<a href="{{ url_for('compta.journal') }}">Journal</a>
<a href="{{ url_for('compta.balance') }}">Balance</a>
<a href="{{ url_for('compta.historique') }}">Historique</a>
<a href="{{ url_for('compta.plan') }}">Plan comptable</a>
<a href="{{ url_for('compta.axes') }}">Axes analytiques</a>
<a href="{{ url_for('compta.journaux') }}">Journaux</a>
{% if g.utilisateur %}<span class="droite"><a href="{{ url_for('auth.utilisateurs') }}">{{ g.utilisateur.nom }}</a>
<form method="post" action="{{ url_for('auth.logout') }}" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Déconnexion</button></form></span>{% endif %}</nav>
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<p class="msg {{ cat }}">{{ msg }}</p>{% endfor %}
{% block contenu %}{% endblock %}
</main></body></html>
